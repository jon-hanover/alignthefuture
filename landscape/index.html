          <h2 id="landscape-title">Who else is doing this work?</h2>
          <p class="intro">From what we can tell, there is no comparable <strong>international, residential youth program that combines the humanities and AI research</strong>. But there is a robust, emerging ecosystem of organizations tackling related problems, and we hope many of them will be partners in this effort.</p>
        </header>

          <colgroup><col class="c-dim"><col class="c-atf"><col><col><col><col><col><col><col><col><col></colgroup>
          <thead>
            <tr><td class="corner"></td><th scope="col" class="atf"><span class="org"><img src="/brand/logo-circles.png" alt="" width="180" height="137"><span class="org-name">Align the Future</span><span class="info tip-l"><button type="button" class="i" aria-label="About Align the Future" aria-expanded="false">i</button><span class="tip" role="tooltip"><span class="tip-name">Align the Future</span><span class="tip-desc">An international, experiential and cross-disciplinary summer program that equips young people to align and govern AI, and places graduates directly into labs, think tanks and government.</span><ul class="tip-facts"><li>~100 rising seniors</li><li>8 to 10 weeks at a top university</li><li>Pilot summer 2027</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://kairos-project.org/" target="_blank" rel="noopener">Kairos</a><span class="info"><button type="button" class="i" aria-label="About Kairos" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://kairos-project.org/" target="_blank" rel="noopener">Kairos</a><span class="tip-desc">A young nonprofit building talent pipelines into AI safety, funded with $50M from Coefficient Giving in 2026. Its programs include the <a href="https://pathfinder.kairos-project.org/" target="_blank" rel="noopener">Pathfinder Fellowship</a> for university AI safety groups, <a href="https://sparai.org/" target="_blank" rel="noopener">SPAR</a>, a remote research fellowship, and the <a href="https://generatorresidency.org/" target="_blank" rel="noopener">Generator Residency</a> in Berkeley.</span><ul class="tip-facts"><li>University students and early career</li><li>Founded 2024</li><li>SPAR admits about 1 in 5</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://www.cee.org/programs/research-science-institute" target="_blank" rel="noopener">RSI</a><span class="info"><button type="button" class="i" aria-label="About Research Science Institute" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://www.cee.org/programs/research-science-institute" target="_blank" rel="noopener">Research Science Institute</a><span class="tip-desc">One of the world’s most selective summer research programs for high schoolers. Focused on science talent and international cooperation broadly, with no AI safety content.</span><ul class="tip-facts"><li>~100 rising seniors</li><li>6 weeks at MIT</li><li>Free</li><li>Since 1984</li><li>About 2.5% admitted</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://www.fabric.camp/" target="_blank" rel="noopener">FABRIC</a><span class="info"><button type="button" class="i" aria-label="About FABRIC" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://www.fabric.camp/" target="_blank" rel="noopener">FABRIC</a><span class="tip-desc">Prague nonprofit running free residential camps for talented, analytical students from around the world. Its Program on AI and Reasoning explores how minds work, artificial and human, as science, with attention to the ethics and safety of AI.</span><ul class="tip-facts"><li>Ages 16 to 21</li><li>About 10 days, mostly in the UK</li><li>Free</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://ml4good.org/" target="_blank" rel="noopener">ML4Good</a><span class="info"><button type="button" class="i" aria-label="About ML4Good" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://ml4good.org/" target="_blank" rel="noopener">ML4Good</a><span class="tip-desc">Bootcamps that equip technical and governance talent to join the AI safety field, run on five continents.</span><ul class="tip-facts"><li>Early to late career</li><li>8 to 10 day residential bootcamps</li><li>Free</li><li>About 15% admitted</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://www.matsprogram.org/" target="_blank" rel="noopener">MATS</a><span class="info"><button type="button" class="i" aria-label="About MATS" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://www.matsprogram.org/" target="_blank" rel="noopener">MATS</a><span class="tip-desc">Independent research fellowship that pairs talented researchers with top mentors in AI alignment, transparency and security, with a funded extension for many fellows.</span><ul class="tip-facts"><li>Researchers 18 and up</li><li>12 weeks in Berkeley or London</li><li>Stipend</li><li>About 5% admitted</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://datasociety.net/ai-civics/" target="_blank" rel="noopener">AI Civics</a><span class="info"><button type="button" class="i" aria-label="About Data &amp; Society, AI Civics" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://datasociety.net/ai-civics/" target="_blank" rel="noopener">Data &amp; Society, AI Civics</a><span class="tip-desc">A public education program on AI and society from Data &amp; Society, launched in 2026 with $3M from Humanity AI. It starts by convening communities in libraries across the US, with the Digital Public Library of America.</span><ul class="tip-facts"><li>General public</li><li>Community convenings</li><li>US only</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://www.non-trivial.org/" target="_blank" rel="noopener">Non-Trivial</a><span class="info tip-r"><button type="button" class="i" aria-label="About Non-Trivial" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://www.non-trivial.org/" target="_blank" rel="noopener">Non-Trivial</a><span class="tip-desc">Virtual research incubator where talented teens take on the world’s most pressing problems, AI among them, mentored by trained facilitators from top universities. Run by Leaf.</span><ul class="tip-facts"><li>Ages 14 to 20</li><li>Online</li><li>Free</li><li>Prize scholarships up to $10,000</li><li>Fellowship admits about 1.5%</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://leaf.courses/dilemmas-and-dangers-in-ai" target="_blank" rel="noopener">Leaf</a><span class="info tip-r"><button type="button" class="i" aria-label="About Leaf" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://leaf.courses/dilemmas-and-dangers-in-ai" target="_blank" rel="noopener">Leaf</a><span class="tip-desc">Nonprofit running four online fellowships for teens. “Dilemmas and Dangers in AI” pairs AI risk and governance with ethics and history. Leaf also runs Non-Trivial.</span><ul class="tip-facts"><li>Ages 14 to 19</li><li>Online, five weeks</li><li>Sliding scale, free if needed</li><li>About 15% admitted</li></ul></span></span></span></th><th scope="col"><span class="org"><a class="org-name" href="https://bluedot.org/" target="_blank" rel="noopener">BlueDot</a><span class="info tip-r"><button type="button" class="i" aria-label="About BlueDot" aria-expanded="false">i</button><span class="tip" role="tooltip"><a class="tip-name" href="https://bluedot.org/" target="_blank" rel="noopener">BlueDot</a><span class="tip-desc">Talent accelerator for beneficial AI and societal resilience. Runs online courses, funds talented people and brings ambitious teams together in person.</span><ul class="tip-facts"><li>Professionals</li><li>Online courses</li><li>Free or pay what you want</li><li>27 to 70% admitted, by course</li></ul></span></span></span></th></tr>
